[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Offres retirées (visible: false) : redirection vers la page de leur famille
[[redirects]]
  from = "/offres/formation-produits-capillaires"
  to = "/formations"
  status = 301

[[redirects]]
  from = "/offres/formation-cosmetique-capillaire"
  to = "/formations"
  status = 301

[[redirects]]
  from = "/offres/coaching-conseils-capillaires"
  to = "/coachings"
  status = 301

[[redirects]]
  from = "/reserver/coaching-conseils-capillaires"
  to = "/reserver"
  status = 301

# Application monopage : toutes les routes renvoient index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
